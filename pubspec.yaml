name: family_finance_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2
  webview_flutter: ^4.10.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  local_auth: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0D756D"
  adaptive_icon_foreground: "assets/icon/app_icon.png"